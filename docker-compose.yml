services:
  postgres:
    image: postgres:16
    container_name: ai-compute-fabric-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: compute_fabric
      POSTGRES_USER: compute_fabric
      POSTGRES_PASSWORD: compute_fabric_dev
    ports:
      - "5432:5432"
    volumes:
      - compute_fabric_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-compute-fabric-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://compute_fabric:compute_fabric_dev@postgres:5432/compute_fabric
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-compute-fabric-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: ai-compute-fabric-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - compute_fabric_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  compute_fabric_postgres_data:
  compute_fabric_grafana_data:
