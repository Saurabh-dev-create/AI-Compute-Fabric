apiVersion: v1
kind: ServiceAccount
metadata:
  name: compute-fabric-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compute-fabric-workload-launcher
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compute-fabric-workload-launcher
subjects:
  - kind: ServiceAccount
    name: compute-fabric-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compute-fabric-workload-launcher
