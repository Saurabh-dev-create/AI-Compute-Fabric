apiVersion: v1
kind: ServiceAccount
metadata:
  name: compute-fabric-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compute-fabric-workload-launcher
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
      - jobs/status
    verbs:
      - create
      - get
      - delete

  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
    verbs:
      - create
      - get
      - delete

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compute-fabric-workload-launcher
subjects:
  - kind: ServiceAccount
    name: compute-fabric-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compute-fabric-workload-launcher
