apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-fabric-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compute-fabric-grafana
  template:
    metadata:
      labels:
        app: compute-fabric-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
              subPath: dashboard.yml
              readOnly: true
            - name: grafana-dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: grafana-provisioning
          configMap:
            name: compute-fabric-grafana-provisioning
        - name: grafana-dashboard
          configMap:
            name: compute-fabric-grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app: compute-fabric-grafana
  ports:
    - port: 3000
      targetPort: 3000
