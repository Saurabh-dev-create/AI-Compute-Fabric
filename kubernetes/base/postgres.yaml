apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compute-fabric-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-fabric-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compute-fabric-postgres
  template:
    metadata:
      labels:
        app: compute-fabric-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: compute-fabric-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: compute-fabric-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: compute-fabric-postgres
  ports:
    - port: 5432
      targetPort: 5432
