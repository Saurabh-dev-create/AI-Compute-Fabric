apiVersion: v1
kind: ConfigMap
metadata:
  name: compute-fabric-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "ai-compute-fabric"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "compute-fabric-api:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-fabric-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compute-fabric-prometheus
  template:
    metadata:
      labels:
        app: compute-fabric-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: compute-fabric-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app: compute-fabric-prometheus
  ports:
    - port: 9090
      targetPort: 9090
