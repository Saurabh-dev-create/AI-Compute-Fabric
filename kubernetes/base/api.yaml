apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-fabric-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compute-fabric-api
  template:
    metadata:
      labels:
        app: compute-fabric-api
    spec:
      containers:
        - name: api
          image: ghcr.io/saurabh-dev-create/ai-compute-fabric:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compute-fabric-postgres-secret
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: compute-fabric-api
spec:
  type: ClusterIP
  selector:
    app: compute-fabric-api
  ports:
    - port: 8000
      targetPort: 8000
