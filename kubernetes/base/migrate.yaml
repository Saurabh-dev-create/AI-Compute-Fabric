apiVersion: batch/v1
kind: Job
metadata:
  name: compute-fabric-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: compute-fabric-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/saurabh-dev-create/ai-compute-fabric:latest
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compute-fabric-postgres-secret
                  key: DATABASE_URL
