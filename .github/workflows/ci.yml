name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compute_fabric
          POSTGRES_USER: compute_fabric
          POSTGRES_PASSWORD: compute_fabric_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U compute_fabric -d compute_fabric"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://compute_fabric:compute_fabric_dev@localhost:5432/compute_fabric

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build API image
        run: docker build -t ai-compute-fabric:ci .
