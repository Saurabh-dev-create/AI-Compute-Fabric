[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compute-fabric"
version = "0.1.0"
description = "AI-aware compute control plane for GPU workloads"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]
